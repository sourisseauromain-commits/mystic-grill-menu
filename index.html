<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Grill — Menu</title>
<meta name="description" content="Mystic Grill Bergheim — Menu FR / EN / DE, burgers artisanaux, galettes bretonnes, crêpes, boissons artisanales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --sunset-top:#FF9D5C;
    --sunset-mid:#F2A65A;
    --sunset-bottom:#2F8F82;
    --forest:#2F5D50;
    --cream:#FFF8EE;
    --ink:#1F2E28;
    --gold:#C9973B;
    --line:#d8cdb8;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'EB Garamond', serif;
    color:var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 15% 0%, rgba(255,255,255,0.18), transparent 60%),
      linear-gradient(180deg, var(--sunset-top) 0%, var(--sunset-mid) 28%, var(--sunset-bottom) 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .eyebrow{
    font-family:'Cinzel', serif;
    letter-spacing:0.14em;
    text-transform:uppercase;
    font-size:0.72rem;
    font-weight:600;
  }
  /* ---- Language switcher ---- */
  .lang-bar{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    justify-content:center;
    gap:0.5rem;
    padding:0.7rem 1rem;
    background:rgba(31,46,40,0.92);
    backdrop-filter:blur(6px);
  }
  .lang-btn{
    font-family:'Cinzel', serif;
    font-size:0.78rem;
    letter-spacing:0.08em;
    color:#f2e9d8;
    background:transparent;
    border:1px solid rgba(242,233,216,0.35);
    border-radius:999px;
    padding:0.4rem 1rem;
    cursor:pointer;
    transition:all .2s ease;
  }
  .lang-btn.active, .lang-btn:hover{
    background:var(--gold);
    border-color:var(--gold);
    color:var(--ink);
  }

  /* ---- Hero ---- */
  .hero{
    text-align:center;
    padding:2.6rem 1.2rem 1.4rem;
    color:#fff8ee;
  }
  .hero .brand{
    font-family:'Berkshire Swash', cursive;
    font-size:clamp(2.6rem, 9vw, 4.2rem);
    line-height:1;
    margin:0;
    text-shadow:0 3px 10px rgba(0,0,0,0.18);
  }
  .hero .tagline{
    font-style:italic;
    font-size:1.05rem;
    margin-top:0.6rem;
    opacity:0.95;
  }
  .hero .place{
    margin-top:0.9rem;
    font-family:'Cinzel',serif;
    font-size:0.78rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
    opacity:0.9;
  }

  /* ---- Category ticket cards ---- */
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:0.5rem 1rem 3rem;
  }
  .ticket{
    background:var(--cream);
    border-radius:14px;
    margin:1.6rem 0;
    box-shadow:0 12px 30px rgba(20,30,25,0.22);
    overflow:hidden;
    position:relative;
  }
  .ticket-head{
    padding:1.3rem 1.5rem 0.9rem;
    text-align:center;
    border-bottom:1.5px dashed var(--line);
  }
  .ticket-head h2{
    font-family:'Berkshire Swash', cursive;
    font-weight:400;
    font-size:clamp(1.7rem, 5vw, 2.3rem);
    margin:0 0 0.2rem;
    color:var(--forest);
  }
  .ticket-head .sub{
    font-size:0.9rem;
    font-style:italic;
    color:#5a5347;
  }
  .items{
    padding:1rem 1.6rem 1.5rem;
  }
  .item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:1rem;
    padding:0.65rem 0;
    border-bottom:1px solid rgba(216,205,184,0.6);
  }
  .item:last-child{border-bottom:none;}
  .item-name{
    font-weight:600;
    font-size:1.08rem;
    white-space:nowrap;
  }
  .item-desc{
    flex:1;
    font-size:0.95rem;
    color:#4a453a;
    padding:0 0.4rem;
  }
  .item-price{
    font-family:'Cinzel',serif;
    font-weight:600;
    font-size:0.95rem;
    color:var(--gold);
    white-space:nowrap;
  }
  .item-row-simple{
    display:flex;
    justify-content:space-between;
    padding:0.5rem 0;
    border-bottom:1px solid rgba(216,205,184,0.6);
    font-size:1.02rem;
  }
  .item-row-simple:last-child{border-bottom:none;}
  .drink-group{margin-bottom:0.9rem;}
  .drink-group h4{
    font-family:'Cinzel',serif;
    font-size:0.78rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--forest);
    margin:0 0 0.4rem;
  }

  .two-col{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1.2rem;
  }
  @media (max-width:640px){
    .two-col{grid-template-columns:1fr;}
  }

  /* ---- Info box ---- */
  .info-box{
    background:var(--forest);
    color:#fdf6e8;
    border-radius:14px;
    padding:1.4rem 1.6rem;
    text-align:center;
    margin:1.6rem 0;
    box-shadow:0 12px 30px rgba(20,30,25,0.22);
  }
  .info-box .addr{font-family:'Cinzel',serif; font-weight:600; font-size:1.1rem; letter-spacing:0.02em;}
  .info-box .hours{margin-top:0.5rem; font-size:0.95rem; opacity:0.95;}
  .info-box .phone{margin-top:0.6rem; font-family:'Cinzel',serif; font-size:1.05rem; letter-spacing:0.06em;}

  /* ---- Social buttons ---- */
  .social{
    display:flex;
    flex-direction:column;
    gap:0.7rem;
    margin:1.8rem 0 0.5rem;
  }
  .social a{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.6rem;
    font-family:'Cinzel',serif;
    font-size:0.85rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-decoration:none;
    color:#fff;
    padding:0.85rem 1rem;
    border-radius:999px;
    box-shadow:0 8px 18px rgba(20,30,25,0.25);
    transition:transform .15s ease;
  }
  .social a:hover{transform:translateY(-2px);}
  .social .google{background:#c9973b;}
  .social .facebook{background:#3b5998;}
  .social .instagram{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af,#515bd4);}

  footer{
    text-align:center;
    padding:1.5rem 1rem 2.5rem;
    color:#fff8ee;
    font-family:'Cinzel',serif;
    font-size:0.7rem;
    letter-spacing:0.08em;
    opacity:0.85;
  }
</style>
</head>

function itemsHTML(items){
  return items.map(([name,desc,price])=>`
    <div class="item">
      <div>
        <span class="item-name">${name}</span>
        ${desc?`<div class="item-desc">${desc}</div>`:""}
      </div>
      <div class="item-price">${price}</div>
    </div>`).join("");
}

function drinkGroupHTML(groups){
  return groups.map(g=>`
    <div class="drink-group">
      <h4>${g.label}</h4>
      ${g.rows.map(([name,price])=>`
        <div class="item-row-simple"><span>${name}</span><span class="item-price">${price}</span></div>
      `).join("")}
    </div>`).join("");
}

function render(lang){
  const d = DATA[lang];
  document.querySelector('[data-i18n="tagline"]').textContent = d.tagline;
  const s = d.sections;
  document.getElementById("content").innerHTML = `
    <div class="ticket">
      <div class="ticket-head"><h2>${s.burgers.title}</h2><div class="sub">${s.burgers.sub}</div></div>
      <div class="items">${itemsHTML(s.burgers.items)}</div>
    </div>

    <div class="two-col">
      <div class="ticket">
        <div class="ticket-head"><h2>${s.galettes.title}</h2><div class="sub">${s.galettes.sub}</div></div>
        <div class="items">${itemsHTML(s.galettes.items)}</div>
      </div>
      <div class="ticket">
        <div class="ticket-head"><h2>${s.crepes.title}</h2><div class="sub">${s.crepes.sub}</div></div>
        <div class="items">${itemsHTML(s.crepes.items)}</div>
      </div>
    </div>

    <div class="two-col">
      <div class="ticket">
        <div class="ticket-head"><h2>${s.frites.title}</h2><div class="sub">${s.frites.sub}</div></div>
        <div class="items">${itemsHTML(s.frites.items)}</div>
      </div>
      <div class="ticket">
        <div class="ticket-head"><h2>${s.boissons.title}</h2><div class="sub">${s.boissons.sub}</div></div>
        <div class="items">${drinkGroupHTML(s.boissons.groups)}</div>
      </div>
    </div>

    <div class="info-box">
      <div class="addr">${d.info.addr}</div>
      <div class="hours">${d.info.hours}</div>
      <div class="phone">${d.info.phone}</div>
    </div>

    <div class="social">
      <a class="google" href="${LINKS.google}" target="_blank" rel="noopener">★ ${d.social.google}</a>
      <a class="facebook" href="${LINKS.facebook}" target="_blank" rel="noopener">${d.social.facebook}</a>
      <a class="instagram" href="${LINKS.instagram}" target="_blank" rel="noopener">${d.social.instagram}</a>
    </div>
  `;
  document.documentElement.lang = lang;
  document.querySelectorAll(".lang-btn").forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));
  localStorage.setItem("mysticgrill-lang", lang);
}

document.querySelectorAll(".lang-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>render(btn.dataset.lang));
});

const browserLang = (navigator.language||"fr").slice(0,2);
const saved = localStorage.getItem("mysticgrill-lang");
const initial = saved || (["fr","en","de"].includes(browserLang) ? browserLang : "fr");
render(initial);
</script>
